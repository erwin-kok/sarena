[package]
name = "sarena-daemon"

edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
sarena-infra = { path = "../sarena-infra", features = ["test"] }
sarena-loader = { path = "../sarena-loader" }
sarena-shared = { path = "../sarena-shared" }
sarena-utils = { path = "../sarena-utils" }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
hex = { workspace = true, features = ["std"] }
ipnet = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
] }
thiserror = { workspace = true }

[[bin]]
name = "sarena-daemon"
path = "src/main.rs"
