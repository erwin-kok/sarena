[package]
name = "sarena-cni-plugin"

edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
test-util = []

[dependencies]
sarena-api-types-v1 = { path = "../sarena-api/types/v1" }
sarena-api-client = { path = "../sarena-api/client" }
sarena-data-plane = { path = "../sarena-data-plane" }
sarena-shared = { path = "../sarena-shared" }
sarena-infra = { path = "../sarena-infra" }
sarena-utils = { path = "../sarena-utils" }

async-trait = { workspace = true }
axum = { workspace = true }
hex = { workspace = true, features = ["std"] }
ipnet = { workspace = true }
libc = { workspace = true }
rscni-plugin = { workspace = true, features = ["async"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }
tracing = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "sarena-cni"
path = "src/main.rs"
