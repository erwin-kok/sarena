[package]
name = "sarena-loader"
description = "In-process TCX/XDP loader: attaches/detaches compiled eBPF programs per endpoint."

edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
test = []

[dependencies]
sarena-infra = { path = "../sarena-infra", features = ["test"] }

aya = { workspace = true }
aya-log = { workspace = true }
log = { workspace = true }
nix = { workspace = true, features = ["poll"] }
tokio = { workspace = true, features = ["rt"] }
thiserror = { workspace = true }
tracing = { workspace = true }
