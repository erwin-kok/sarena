[package]
name = "sarena-cni-plugin"

edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
sarena-api-types-v1 = { path = "../../sarena-api/types/v1" }
sarena-api-client = { path = "../../sarena-api/client" }
sarena-common-plugin = { path = "../common" }
sarena-infra = { path = "../../sarena-infra" }
sarena-utils = { path = "../../sarena-utils" }

async-trait = { workspace = true }
rscni-plugin = { workspace = true, features = ["async"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }
tracing = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "sarena-cni"
path = "src/main.rs"
