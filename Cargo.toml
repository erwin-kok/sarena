[workspace]
members = [
    "sarena-plugins/cni",
    "sarena-plugins/common",
    "sarena-daemon",
    "sarena-api/types/v1",
    "sarena-api/client",
    "sarena-api/server",
    "sarena-infra",
    "sarena-loader",
    "sarena-utils",

    # Test infrastructure
    "sarena-test-macros",
    "sarena-test-runner",

    # Shared (userspace & eBPF)
    "sarena-shared",
    "sarena-shared-test",
    "sarena-test-scapy",

    # Integration tests
    "tests/basic",
    "tests/cni",

    # eBPF framework 
    "sarena-ebpf-common",
    "sarena-ebpf-test-framework",

    # eBPF programs
    "sarena-ebpf-programs",
    "sarena-ebpf-test-programs",

    # Build tooling
    "xtask",
]

default-members = [
    "sarena-plugins/cni",
    "sarena-plugins/common",
    "sarena-daemon",
    "sarena-api/types/v1",
    "sarena-api/client",
    "sarena-api/server",
    "sarena-infra",
    "sarena-loader",
    "sarena-utils",

    # Test infrastructure
    "sarena-test-macros",
    "sarena-test-runner",

    # Shared (userspace & eBPF)
    "sarena-shared", 
    "sarena-shared-test",
    "sarena-test-scapy",

    # Integration tests is not included here because it needs previleges to run.
    # eBPF crates are not included because these are build separately by xtask
    # the xtask is also not included because its a build crate
]

resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/erwin-kok/sarena"
keywords = ["Rust", "CNI", "eBPF", "dataplane"]
version = "0.1.0"

[workspace.dependencies]
anyhow = { version = "1" }
async-trait = "0.1.89"
axum = { version = "0.8", features = ["json"] }
aya = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-build = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-ebpf = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-log = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
aya-log-ebpf = { git = "https://github.com/erwin-kok/aya", branch = "development", default-features = false }
bytes = "1.11"
cargo_metadata = { version = "0.23", default-features = false }
clap = { version = "4.5.20", features = ["std"] }
env_logger = { version = "0.11", default-features = false }
futures = { version = "0.3", default-features = false }
hex = { version = "0.4", default-features = false }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1"
hyper-util = "0.1"
hyperlocal = "0.9"  
ipnet = { version ="2", default-features = false }
libc = "0.2"
log = { version = "0.4", default-features = false }
network-types = { version = "0.2.0", default-features = false }
nix = { version = "0.31", features = ["poll"] }
num-derive = { version = "0.5", default-features = false }
num-traits = { version = "0.2", default-features = false }
proc-macro2 = { version = "1", default-features = false }
proc-macro2-diagnostics = { version = "0.10.1", default-features = false }
quote = { version = "1", default-features = false }
rand = { version = "0.10", default-features = false }
regex = { version = "1.12" }
rscni-plugin = { git = "https://github.com/erwin-kok/rscni", branch = "main", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", default-features = false }
thiserror = { version = "2" }
tokio = { version = "1.40" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1" }
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", default-features = false }
url = { version = "2" }
uuid = { version = "1", features = ["v4"] }
which = { version = "8" }
wiremock = "0.6"

[workspace.lints.clippy]
all = "warn"
cargo = "warn"
pedantic = "warn"

cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
default_trait_access = { level = "allow", priority = 1 }
inline_always = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
len_without_is_empty = { level = "allow", priority = 1 }
match_same_arms = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
semicolon_if_nothing_returned = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
transmute_ptr_to_ptr = { level = "allow", priority = 1 }
unreadable_literal = { level = "allow", priority = 1 }

cargo_common_metadata = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }

[profile.ebpf]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 2
strip = false
overflow-checks = false
