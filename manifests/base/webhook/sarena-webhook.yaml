---
apiVersion: v1
kind: Secret
data:
  tls.crt: 
  tls.key: 
metadata:
  name: sarena-kubernetes-webhook-tls
  namespace: sarena-system
type: kubernetes.io/tls
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: addresspool.sarena.erwinkok.org
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: 
    service:
      name: sarena-kubernetes-webhook
      namespace: sarena-system
      path: /validate/addresspool
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: addresspool.sarena.erwinkok.org
  rules:
  - apiGroups:
    - sarena.erwinkok.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - addresspools
    scope: Cluster
  sideEffects: None
  timeoutSeconds: 5
